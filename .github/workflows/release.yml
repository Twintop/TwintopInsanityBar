name: Release

# One tag builds one flavor:
#   12.1.0.11-release           -> mainline (retail) build
#   12.1.0.11-beta01            -> mainline pre-release
#   forever-1.60.1.0-release    -> WoW Forever build
# The stage job lints, smoke-loads, and builds the flavor with build/stage.ps1 as a workflow artifact.
# The publish job runs the BigWigs packager, which creates the GitHub release, attaches its zip, and
# uploads to CurseForge / Wago / WoWInterface for every site whose token secret exists. Its changelog
# is the newest section of the flavor's News.lua. A workflow_dispatch run only builds the zip.

on:
  push:
    tags:
      - "*-release"
      - "*-beta*"
      - "*-alpha*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to stage (mainline, forever)"
        required: true
        default: "mainline"
      version:
        description: "Version to stamp (blank keeps the TOC value)"
        required: false
        default: ""
      releaseType:
        description: "release, beta or alpha"
        required: false
        default: "alpha"

permissions:
  contents: write

jobs:
  stage:
    name: Check and stage
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.meta.outputs.flavor }}
      version: ${{ steps.meta.outputs.version }}
      releaseType: ${{ steps.meta.outputs.releaseType }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve flavor and version from the tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAVOR="${{ github.event.inputs.flavor }}"
            VERSION="${{ github.event.inputs.version }}"
            RELEASE_TYPE="${{ github.event.inputs.releaseType }}"
          else
            TAG="${GITHUB_REF_NAME}"
            # Optional "<flavor>-" prefix; no prefix means mainline.
            if [[ "$TAG" =~ ^([A-Za-z]+)-([0-9][0-9.]*)-(release|beta[0-9]*|alpha[0-9]*)$ ]]; then
              FLAVOR="${BASH_REMATCH[1]}"; VERSION="${BASH_REMATCH[2]}"; RELEASE_TYPE="${BASH_REMATCH[3]}"
            elif [[ "$TAG" =~ ^([0-9][0-9.]*)-(release|beta[0-9]*|alpha[0-9]*)$ ]]; then
              FLAVOR="mainline"; VERSION="${BASH_REMATCH[1]}"; RELEASE_TYPE="${BASH_REMATCH[2]}"
            else
              echo "Tag '$TAG' is not <flavor->x.y.z.w-<release|betaNN|alphaNN>"; exit 1
            fi
          fi
          FLAVOR="$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releaseType=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR version=$VERSION type=$RELEASE_TYPE"

      - name: Require the tag version to match the flavor TOC
        if: steps.meta.outputs.version != ''
        shell: bash
        run: |
          FLAVOR="${{ steps.meta.outputs.flavor }}"
          VERSION="${{ steps.meta.outputs.version }}"
          toc_version() { tr -d '\r' < "$1" | sed -n 's/^\xEF\xBB\xBF//; s/^## Version:[[:space:]]*//p' | head -n 1; }
          if [ "$FLAVOR" = "mainline" ]; then TOC="TwintopInsanityBar.toc"; else TOC="$(find Flavors -mindepth 2 -maxdepth 2 -ipath "Flavors/$FLAVOR/TwintopInsanityBar.toc" | head -n 1)"; fi
          if [ -z "$TOC" ] || [ ! -f "$TOC" ]; then echo "No TOC for flavor '$FLAVOR'"; exit 1; fi
          TOC_VERSION="$(toc_version "$TOC")"
          if [ "$TOC_VERSION" = "$VERSION" ]; then echo "$TOC is $TOC_VERSION"; exit 0; fi
          echo "Tag version $VERSION does not match $TOC (## Version: $TOC_VERSION), so this tag is not a $FLAVOR release."
          # Name the flavor whose TOC does carry this version, if any, so the fix is one retag.
          for other in TwintopInsanityBar.toc Flavors/*/TwintopInsanityBar.toc; do
            if [ "$(toc_version "$other")" = "$VERSION" ]; then
              prefix=""; [ "$other" != "TwintopInsanityBar.toc" ] && prefix="$(basename "$(dirname "$other")" | tr '[:upper:]' '[:lower:]')-"
              echo "$other is $VERSION; tag it as ${prefix}${VERSION}-${{ steps.meta.outputs.releaseType }}"
            fi
          done
          exit 1

      - name: Lint Core for class/spec leakage
        shell: pwsh
        run: ./build/lint-core.ps1

      - name: Syntax-check every Lua file
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null
          status=0
          while IFS= read -r f; do
            luac5.1 -p "$f" || status=1
          done < <(git ls-files '*.lua' | grep -v '^Libs/')
          exit $status

      - name: Smoke-load every flavor for every class
        shell: pwsh
        run: ./build/smoke.ps1 -Lua lua5.1

      - name: Stage flavor
        shell: pwsh
        run: |
          $zip = ./build/stage.ps1 -Flavor "${{ steps.meta.outputs.flavor }}" -Version "${{ steps.meta.outputs.version }}" -ReleaseType "${{ steps.meta.outputs.releaseType }}" -OutDir "${{ github.workspace }}/dist" | Select-Object -Last 1
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload staged zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: staged-${{ steps.meta.outputs.flavor }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.releaseType }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  publish:
    # The packager reads the game type from the TOC at the repository root and the site ids from its
    # X-Curse-Project-ID / X-WoWI-ID / X-Wago-ID lines. It skips any site whose token is missing, and
    # skips WoWInterface for Forever on its own because that site has no Forever game version.
    name: Package and publish
    needs: stage
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md from the flavor's News.lua
        id: changelog
        shell: bash
        run: |
          FLAVOR="${{ needs.stage.outputs.flavor }}"
          FLAVOR_DIR="$(find Flavors -mindepth 1 -maxdepth 1 -type d -iname "$FLAVOR" | head -n 1)"
          if [ -z "$FLAVOR_DIR" ]; then echo "Unknown flavor '$FLAVOR'"; exit 1; fi
          # Newest "# <version>" section of the flavor news, then the newest Core section retitled.
          # In-addon "(#NNN)" links become GitHub issue links and "(tab:...)" links become plain text,
          # since neither resolves outside the News window.
          newest() { tr -d '\r' < "$1" | awk '/^# /{n++} n==2||/^\]====\]/{exit} n==1 && !/^---$/{print}'; }
          { newest "$FLAVOR_DIR/News.lua"; echo; newest Core/News.lua | sed -E '1s/^# .*/## Core Changes/'; } \
            | sed -E 's#\]\(\#([0-9]+)\)#](https://github.com/Twintop/TwintopInsanityBar/issues/\1)#g' \
            | sed -E 's#\[([^]]+)\]\(tab:[A-Za-z]+\)#\1#g' > CHANGELOG.md
          if [ ! -s CHANGELOG.md ]; then echo "No release section found in $FLAVOR_DIR/News.lua"; exit 1; fi
          echo "flavorDir=$FLAVOR_DIR" >> "$GITHUB_OUTPUT"
          cat CHANGELOG.md

      - name: Put the flavor's TOC at the repository root
        if: needs.stage.outputs.flavor != 'mainline'
        shell: bash
        run: cp "${{ steps.changelog.outputs.flavorDir }}/TwintopInsanityBar.toc" TwintopInsanityBar.toc

      - name: Resolve packager arguments
        id: pkg
        shell: bash
        run: |
          FLAVOR="${{ needs.stage.outputs.flavor }}"
          if [ "$FLAVOR" = "mainline" ]; then
            ARGS="-m .pkgmeta -g retail"
          else
            ARGS="-m .pkgmeta-$FLAVOR -g $FLAVOR"
          fi
          # The tag already carries the flavor prefix, so name the zip from it alone.
          ARGS="$ARGS -n \"{package-name}-{project-version}\""
          # A manual run is a build-only dry run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS -d"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "$ARGS"

      - name: Package and upload with the BigWigs packager
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ steps.pkg.outputs.args }}

      - name: Upload packager zip as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: packager-${{ needs.stage.outputs.flavor }}
          path: .release/*.zip
          if-no-files-found: error
